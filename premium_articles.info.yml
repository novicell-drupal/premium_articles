name: Premium Articles
description: Article functionality of the Drupal Premium distribution.
type: module
core_version_requirement: ^11
version: '4.0'
package: Drupal Premium

dependencies:
  - core:text
  - core:datetime
  - core:path
  - core:media_library
  - field_group:field_group
  - paragraphs_asymmetric_translation_widgets:paragraphs_asymmetric_translation_widgets
